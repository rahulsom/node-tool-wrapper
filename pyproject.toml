[project]
name = "node-tool-wrapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.4.2",
    "pytest-xdist>=3.6.1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This process.*is multi-threaded, use of forkpty\\(\\) may lead to deadlocks in the child:DeprecationWarning",
]
